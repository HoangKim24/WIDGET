name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project LichTuanApp.xcodeproj \
            -scheme LichTuanApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Archive app
        run: |
          set -o pipefail
          xcodebuild \
            -project LichTuanApp.xcodeproj \
            -scheme LichTuanApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LichTuanApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p exported/Payload
          cp -R build/LichTuanApp.xcarchive/Products/Applications/LichTuanApp.app exported/Payload/
          ditto -c -k --sequesterRsrc --keepParent exported/Payload exported/LichTuanApp.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lich-tuan-ipa
          path: exported/LichTuanApp.ipa
