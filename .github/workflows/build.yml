name: Build and Screenshot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Build app debug
        run: |
          set -o pipefail
          xcodebuild \
            -project LichTuanApp.xcodeproj \
            -scheme LichTuanApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  ui-tests:
    runs-on: macos-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project LichTuanApp.xcodeproj \
            -scheme LichTuanApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath TestResults.xcresult \
            test | tee test.log

      - name: Install xcparse
        if: always()
        run: brew install chargepoint/xcparse/xcparse

      - name: Extract screenshots
        if: always()
        run: |
          mkdir -p screenshots
          xcparse screenshots TestResults.xcresult screenshots

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-screenshots
          path: screenshots

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

  archive:
    runs-on: macos-latest
    needs: ui-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Prepare export options
        run: |
          if [ -z "${APPLE_TEAM_ID}" ]; then
            echo "APPLE_TEAM_ID secret is required for archive/export." >&2
            exit 1
          fi

          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          EOF
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Show archive build settings
        run: |
          xcodebuild \
            -project LichTuanApp.xcodeproj \
            -scheme LichTuanApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -showBuildSettings > build-settings.log

      - name: Upload build settings on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-settings-log
          path: build-settings.log

      - name: Archive app
        run: |
          set -o pipefail
          xcodebuild \
            -project LichTuanApp.xcodeproj \
            -scheme LichTuanApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LichTuanApp.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            archive | tee archive.log

      - name: Export ipa
        run: |
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/LichTuanApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath exported | tee export.log

      - name: Upload ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lich-tuan-ipa
          path: exported/*.ipa

      - name: Upload archive logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-logs
          path: |
            archive.log
            export.log
