name: Build and Screenshot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Preflight tool versions
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Build app debug
        run: |
          set -o pipefail
          xcodebuild \
            -project LichTuanApp.xcodeproj \
            -scheme LichTuanApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  ui-tests:
    runs-on: macos-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Preflight tool versions
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project LichTuanApp.xcodeproj \
            -scheme LichTuanApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath TestResults.xcresult \
            test | tee test.log

      - name: Install xcparse
        if: always()
        run: brew install chargepoint/xcparse/xcparse

      - name: Extract screenshots
        if: always()
        run: |
          mkdir -p screenshots
          xcparse screenshots TestResults.xcresult screenshots

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-screenshots
          path: screenshots

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

  archive:
    runs-on: macos-latest
    needs: ui-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Preflight tool versions
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Show archive build settings
        run: |
          xcodebuild \
            -project LichTuanApp.xcodeproj \
            -scheme LichTuanApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -showBuildSettings > build-settings.log

      - name: Upload build settings on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-settings-log
          path: build-settings.log

      - name: Archive app
        run: |
          set -o pipefail
          xcodebuild \
            -project LichTuanApp.xcodeproj \
            -scheme LichTuanApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LichTuanApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            archive | tee archive.log

      - name: Package unsigned ipa
        run: |
          set -o pipefail
          mkdir -p exported/Payload
          cp -R build/LichTuanApp.xcarchive/Products/Applications/LichTuanApp.app exported/Payload/
          ditto -c -k --sequesterRsrc --keepParent exported/Payload exported/LichTuanApp.ipa

      - name: Upload ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lich-tuan-ipa
          path: exported/LichTuanApp.ipa

      - name: Upload archive logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-logs
          path: |
            archive.log
