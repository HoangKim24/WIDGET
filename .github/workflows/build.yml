name: Build and Package IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Preflight tool versions
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Build app debug
        run: |
          set -o pipefail
          xcodebuild \
            -project LichTuanApp.xcodeproj \
            -scheme LichTuanApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee build.log

      - name: Run unit tests
        continue-on-error: true
        run: |
          set -o pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -n "$SIMULATOR_UDID" ]; then
            echo "Using iPhone Simulator: $SIMULATOR_UDID"
            xcodebuild \
              -project LichTuanApp.xcodeproj \
              -scheme LichTuanApp \
              -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              test | tee test.log
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  archive:
    runs-on: macos-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive app
        run: |
          set -o pipefail
          xcodebuild \
            -project LichTuanApp.xcodeproj \
            -scheme LichTuanApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LichTuanApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            archive | tee archive.log

      - name: Package unsigned ipa
        run: |
          set -o pipefail
          mkdir -p exported/Payload
          cp -R build/LichTuanApp.xcarchive/Products/Applications/LichTuanApp.app exported/Payload/
          ditto -c -k --sequesterRsrc --keepParent exported/Payload exported/LichTuanApp.ipa

      - name: Upload ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lich-tuan-ipa
          path: exported/LichTuanApp.ipa
