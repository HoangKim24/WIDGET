name: LichTuanApp

options:
  bundleIdPrefix: com.hoangkim24
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.9

targets:
  LichTuanApp:
    type: application
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - path: LichTuanApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangkim24.lichtuan
        INFOPLIST_FILE: LichTuanApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"

  LichTuanAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - path: LichTuanAppTests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangkim24.lichtuan.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LichTuanApp:
    build:
      targets:
        LichTuanApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LichTuanAppTests
